name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST. 헤더·푸터 조각을 새로 받는다(README.md 'Deploy')

# push와 예약 실행이 겹치면 차례로 배포한다(GitHub Pages 공식 예시와 같다)
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 지금 Pages 주소를 알아내 빌드에 넘긴다. 커스텀 도메인이 없으면 hkilbo.github.io + /hk-techblog-client,
      # 있으면 그 도메인 + 빈 경로. 블로그는 그 아래 /blog에 놓인다(astro.config.mjs, README '사이트 주소와 /blog')
      - id: pages
        uses: actions/configure-pages@v5
      - uses: withastro/action@v6
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
